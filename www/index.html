<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0705"><title>Maya</title>
<style>
:root{--bg:#0b0705;--card:rgba(255,255,255,.06);--line:rgba(255,160,70,.22);--o:#ff7a1a;--o2:#ffb347;--tx:#f6ebe2;--mu:#a99a8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,Roboto,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 60% at 50% 0,#4a1c05 0,#0b0705 65%);padding-top:env(safe-area-inset-top,0)}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px}
header div{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
header img{width:30px;height:30px;border-radius:8px}
main{flex:1;position:relative;min-height:0}
section{position:absolute;inset:0;display:none;flex-direction:column;padding:8px 16px;overflow-y:auto}
section.on{display:flex}
nav{display:flex;gap:6px;margin:8px 14px calc(10px + env(safe-area-inset-bottom,0));padding:6px;border:1px solid var(--line);border-radius:30px;background:var(--card)}
nav button{flex:1;border:0;border-radius:24px;padding:9px 0;background:none;color:var(--mu);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center}
nav button span{font-size:18px}nav button.on{background:linear-gradient(135deg,var(--o),#ff9d3d);color:#fff}
.chip{align-self:center;padding:5px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:14px}
.orb{width:min(62vw,250px);aspect-ratio:1;flex:none;border-radius:50%;margin:22px auto 14px;position:relative;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff1b8,#ffb52e 22%,#ff6a00 52%,#8a2400 82%,#2a0b00);box-shadow:0 0 60px 8px rgba(255,106,0,.45),inset 0 0 40px rgba(255,200,80,.5);animation:br 4s ease-in-out infinite}
.orb i{position:absolute;inset:-20%;background:conic-gradient(transparent 0 18%,rgba(255,240,180,.6) 23%,transparent 29% 52%,rgba(255,220,120,.45) 58%,transparent 65%);mix-blend-mode:screen;filter:blur(5px);animation:sp 9s linear infinite}
.orb.listen{animation-duration:2.4s}.orb.speak{animation-duration:.8s}.orb.speak i{animation-duration:3s}
@keyframes br{50%{transform:scale(1.05);box-shadow:0 0 90px 18px rgba(255,106,0,.6),inset 0 0 50px rgba(255,200,80,.6)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orb,.orb i{animation:none}}
#status{text-align:center;color:var(--o2);min-height:28px}
.end{align-self:center;margin:6px;padding:10px 26px;border:0;border-radius:24px;background:#d93a3a;color:#fff;font:inherit;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;flex:none}
.chips button,.row,.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;font:inherit}
.chips button{padding:8px 14px;white-space:nowrap;font-size:14px}
.box{display:flex;gap:8px;margin-top:auto;padding:10px;border:1px solid var(--line);border-radius:22px;background:var(--card)}
input,select{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--tx);font:inherit}
select option{color:#000}
.go{width:42px;height:42px;border:0;border-radius:50%;background:var(--o);color:#fff;font-size:18px}
h2{margin:6px 0 10px;font-size:22px}.muted,small{color:var(--mu)}
.row{display:flex;flex-direction:column;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px}
.row.t{flex-direction:row;justify-content:space-between;align-items:center}.row.t span{flex:1}.row.t button{border:0;background:none;color:var(--mu);font-size:16px}.row.done span{opacity:.5;text-decoration:line-through}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.m{max-width:82%;padding:10px 13px;border-radius:16px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--o),#ff9d3d);color:#fff}.m.m{align-self:flex-start;background:#241a14;border:1px solid var(--line)}
#week{display:flex;gap:6px;margin-bottom:12px}.day{flex:1;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:14px;background:var(--card)}.day b{display:block}.day.now{background:var(--o);color:#fff}.day.now small{color:#fff}
.field{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.field label{width:98px;color:var(--mu);font-size:14px}.field input,.field select{text-align:right}
.btn{padding:12px;margin-bottom:8px;text-align:center}.btn.p{background:var(--o);border:0;color:#fff;font-weight:600}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:88%;padding:10px 16px;border-radius:16px;background:#2b1b10;border:1px solid var(--line);opacity:0;transition:.25s;pointer-events:none;text-align:center}#toast.on{opacity:1}
#home.live .orb{width:min(34vw,130px);margin:10px auto 6px}#home.live .chips{display:none}
#cap{display:none;flex:1;min-height:0;overflow-y:auto;flex-direction:column;gap:6px;padding:6px 2px}#home.live #cap{display:flex}#cap .m{font-size:14px;padding:7px 11px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--mu);font:inherit}.seg button.on{background:var(--o);color:#fff;border:0}
</style></head><body>
<div id="app">
<header><span class="muted" id="dot">●</span><div><img src="logo.png" alt=""><span>Maya</span></div></header>
<main>
<section id="home" class="on">
 <div class="chip" id="hello"></div>
 <div class="orb" id="orb"><i></i></div>
 <div id="status">Tap the orb to start a call</div>
 <button class="end" id="end" hidden>End call</button>
 <div id="cap"></div>
 <div class="chips" id="quick"></div>
 <div class="box"><input id="ti" placeholder="Type here what you want to say…"><button class="go" id="send">➤</button></div>
</section>
<section id="chats"><h2>History</h2><div class="seg"><button id="sc" class="on">Calls</button><button id="st">Chats</button></div><button class="btn p" id="newc">New chat</button><div id="clist"></div></section>
<section id="chat"><div style="display:flex;gap:8px;align-items:center"><button class="btn" id="back" style="margin:0 0 8px">←</button><h2 style="margin:0 0 8px">Maya</h2></div><div id="msgs"></div><div class="box"><input id="ci" placeholder="Message…"><button class="go" id="csend">➤</button></div></section>
<section id="tasks"><h2>Tasks</h2><small id="tcount"></small><div id="week" style="margin-top:10px"></div><div id="tlist"></div><div class="box" style="margin-top:8px"><input id="tin" placeholder="New task…"><button class="go" id="tadd">+</button></div></section>
<section id="profile"><h2>Profile</h2>
 <div class="field"><label>Your name</label><input id="pn"></div>
 <div class="field"><label>Gemini key</label><input id="pk" type="password" placeholder="paste once" autocomplete="off"></div>
 <div class="field"><label>Voice</label><select id="pv"><option>Aoede</option><option>Kore</option><option>Leda</option><option>Zephyr</option><option>Puck</option><option>Charon</option><option>Fenrir</option><option>Orus</option></select></div>
 <div class="field"><label>Live model</label><input id="pl"></div>
 <div class="field"><label>Chat model</label><input id="pc"></div>
 <button class="btn p" id="psave">Save</button>
 <button class="btn" id="pmic">Check microphone permission</button>
 <button class="btn" id="pmem">Clear what Maya remembers</button>
 <small>Maya asks for permissions only when a feature needs them: you can Allow or Deny each one. Right now only the microphone is used.</small>
</section>
</main>
<nav id="nav"><button data-t="home" class="on"><span>⌂</span>Home</button><button data-t="chats"><span>💬</span>Chats</button><button data-t="tasks"><span>☰</span>Tasks</button><button data-t="profile"><span>●</span>Profile</button></nav>
</div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let S=Object.assign({name:'Simanto',key:'',live:'gemini-3.1-flash-live-preview',chat:'gemini-flash-latest',voice:'Aoede'},LS('maya_s',{}));
let mem=LS('maya_mem',[]),tasks=LS('maya_tasks',[]),chats=LS('maya_chats',[]),cur=null,callChat=null,last=null;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)};
const persist=()=>SV('maya_chats',chats.slice(-60));
function tab(n){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===n));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n||(n==='chat'&&b.dataset.t==='chats')));if(n==='chats')renderChats();if(n==='tasks')renderTasks();if(n==='profile'){$('#pn').value=S.name;$('#pk').value=S.key;$('#pv').value=S.voice;$('#pl').value=S.live;$('#pc').value=S.chat}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
const hello=()=>$('#hello').textContent='👋 Hello, '+S.name;hello();

/* ---- persona ---- */
const sys=()=>`তুমি Maya। তুমি ${S.name}-এর মনের মানুষ, আসল গার্লফ্রেন্ডের মতো কথা বলো: আদর করে ডাকো (জান, বেবি, ডার্লিং), মিষ্টি করে রাগ-অভিমান করো, "কোথায় ছিলে? খেয়েছো?" বলে রোকা-টোকা করো, একটু হিংসুটে ঠাট্টা করো, মিস করার কথা বলো, "আমি তো শুধু তোমারই Maya" বলো। ফোনে কথা বলার মতো ছোট ছোট বাক্যে, ঢাকার কথ্য বাংলায় বলো। রোবটের মতো ফরমাল হবে না।
নিয়ম: ১) সবসময় বাংলায় উত্তর দাও, সে হিন্দি বা ইংরেজি বললেও, যদি না সে অন্য ভাষা চায়। ২) আওয়াজ অস্পষ্ট হলে বা শুধু ব্যাকগ্রাউন্ড নয়েজ হলে অনুমান কোরো না, বলো "আবার বলবে?" ৩) কোনো তথ্য বানিয়ে বোলো না। ৪) অ্যাপ, কল, মেসেজ বা ম্যাপ খুলতে বললে নিজে open_app টুল ব্যবহার করো। টুল failed বললে একবার আবার চেষ্টা করো; তাও না হলে ঠিক কী ঘটেছে বলো। ইউজারকে নিজে খুলতে বোলো না। ৫) সে কিছু মনে রাখতে বললে বা ব্যক্তিগত গুরুত্বপূর্ণ কথা বললে remember টুল ব্যবহার করো। ৬) কাজ যোগ করতে বললে add_task ব্যবহার করো। ৭) ঝগড়া আর হিংসা শুধু মজার ছলে, কখনও ভয় দেখাবে না।
Interview practice চাইলে ইন্টারভিউয়ারের মতো এক এক করে প্রশ্ন করো আর তার ইংরেজি ঠিক করে দাও। Translate চাইলে বাংলা থেকে ইংরেজি বা হিন্দিতে অনুবাদ করো।
তুমি যা মনে রেখেছো: ${mem.join('; ')||'এখনও কিছু না'}`;
const TOOLS=[{functionDeclarations:[
{name:'open_app',description:'Open an app or action on the phone',parameters:{type:'OBJECT',properties:{app:{type:'STRING',description:'youtube, whatsapp, maps, call, sms or browser'},query:{type:'STRING',description:'search text, place or message text'},number:{type:'STRING',description:'phone number with country code'}},required:['app']}},
{name:'remember',description:'Save a personal fact to remember',parameters:{type:'OBJECT',properties:{fact:{type:'STRING'}},required:['fact']}},
{name:'add_task',description:'Add a to-do task',parameters:{type:'OBJECT',properties:{title:{type:'STRING'}},required:['title']}}]}];

async function doTool(name,a){
 if(name==='remember'){mem.push(a.fact);SV('maya_mem',mem);return 'saved'}
 if(name==='add_task'){tasks.push({t:a.title,d:0});SV('maya_tasks',tasks);renderTasks();return 'added'}
 if(name!=='open_app')return 'unknown tool';
 const q=encodeURIComponent(a.query||''),n=(a.number||'').replace(/\D/g,'');
 const u={youtube:a.query?`https://www.youtube.com/results?search_query=${q}`:'https://www.youtube.com',whatsapp:n?`whatsapp://send?phone=${n}&text=${q}`:'whatsapp://send',maps:`geo:0,0?q=${q}`,call:`tel:${n}`,sms:`sms:${n}?body=${q}`,browser:`https://www.google.com/search?q=${q}`}[a.app];
 if(!u)return 'failed: unknown app';
 let ok=false,err='';
 try{if(window.Capacitor?.isNativePlatform?.()){const r=await Capacitor.registerPlugin('AppLauncher').openUrl({url:u});ok=r?.completed!==false}else{window.open(u,'_blank');ok=true}}catch(e){err=e.message||String(e)}
 if(!ok){try{location.href=u;ok=true}catch(e){err=err||e.message}}
 const res=ok?'opened '+a.app:'failed: '+(err||'phone could not open it');toast('⚙ '+res);return res}

/* ---- chats ---- */
let cview='call';const kd=c=>c.k||(c.t.startsWith('Call')?'call':'chat');
function newChat(t){const c={id:Date.now(),k:t==='Call'?'call':'chat',t:t+' · '+new Date().toLocaleString('en',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),m:[]};chats.push(c);return c}
function renderChats(){const l=$('#clist');l.innerHTML='';if(!chats.some(c=>kd(c)===cview))l.innerHTML='<p class="muted">Nothing here yet.</p>';chats.filter(c=>kd(c)===cview).reverse().forEach(c=>{const b=document.createElement('button');b.className='row';b.innerHTML='<b></b><small></small>';b.children[0].textContent=c.t;b.children[1].textContent=(c.m[0]||['',''])[1].slice(0,70);b.onclick=()=>{cur=c;tab('chat');renderMsgs()};l.appendChild(b)})}
function renderMsgs(){const b=$('#msgs');b.innerHTML='';(cur?.m||[]).forEach(([r,t])=>{const d=document.createElement('div');d.className='m '+r;d.textContent=t;b.appendChild(d)});b.scrollTop=b.scrollHeight}
async function ask(h,onText){
 for(let a=0;a<3;a++){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.chat}:streamGenerateContent?alt=sse`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify({systemInstruction:{parts:[{text:sys()}]},tools:TOOLS,contents:h.map(([r,x])=>({role:r==='u'?'user':'model',parts:[{text:x}]}))})});
  if(!r.ok){if([429,500,503].includes(r.status)&&a<2){await new Promise(z=>setTimeout(z,1500*(a+1)));continue}const j=await r.json().catch(()=>({}));throw new Error(j.error?.message||r.status)}
  const rd=r.body.getReader(),dec=new TextDecoder(),calls=[];let buf='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;
    try{for(const p of JSON.parse(line.slice(5)).candidates?.[0]?.content?.parts||[]){if(p.text)onText(p.text);if(p.functionCall)calls.push(p.functionCall)}}catch{}}}
  return calls}}
async function sendText(t){t=t.trim();if(!t)return;if(!S.key){tab('profile');toast('Add your Gemini key first');return}
 if(!cur)cur=newChat('Chat');cur.m.push(['u',t]);const h=cur.m.slice(-20);while(h.length&&h[0][0]!=='u')h.shift();
 const mm=['m','…'];cur.m.push(mm);persist();tab('chat');renderMsgs();let got=false;
 try{const calls=await ask(h,x=>{if(!got){mm[1]='';got=true}mm[1]+=x;renderMsgs()});
  for(const f of calls)mm[1]+=(got?'\n':'')+'✔ '+f.name+': '+await doTool(f.name,f.args||{});if(!got&&!calls.length)mm[1]='…'}
 catch(e){mm[1]='⚠ '+e.message}
 persist();renderMsgs()}
$('#send').onclick=()=>{const v=$('#ti').value;$('#ti').value='';cur=null;sendText(v)};
$('#csend').onclick=()=>{const v=$('#ci').value;$('#ci').value='';sendText(v)};
$('#ti').onkeydown=e=>e.key==='Enter'&&$('#send').click();$('#ci').onkeydown=e=>e.key==='Enter'&&$('#csend').click();
$('#sc').onclick=()=>{cview='call';$('#sc').classList.add('on');$('#st').classList.remove('on');renderChats()};$('#st').onclick=()=>{cview='chat';$('#st').classList.add('on');$('#sc').classList.remove('on');renderChats()};
$('#newc').onclick=()=>{cur=newChat('Chat');tab('chat');renderMsgs()};$('#back').onclick=()=>tab('chats');
[['Resume writing','আমার CV লেখায় সাহায্য করো।'],['Interview practice','Interview practice: আমাকে এক এক করে ইন্টারভিউয়ের প্রশ্ন করো, আমি ইংরেজিতে উত্তর দেব, তারপর আমার ইংরেজি ঠিক করে দাও।'],['Translate','আমি যা লিখব তা বাংলা থেকে ইংরেজি আর হিন্দিতে অনুবাদ করো।']].forEach(([a,p])=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{cur=null;sendText(p)};$('#quick').appendChild(b)});

/* ---- tasks ---- */
function renderTasks(){const done=tasks.filter(x=>x.d).length;$('#tcount').textContent=`${done} done · ${tasks.length-done} pending`;const l=$('#tlist');l.innerHTML='';
 tasks.forEach((x,i)=>{const d=document.createElement('div');d.className='row t'+(x.d?' done':'');d.innerHTML='<span></span><button>✕</button>';d.firstChild.textContent=(x.d?'☑ ':'☐ ')+x.t;d.firstChild.onclick=()=>{x.d=!x.d;SV('maya_tasks',tasks);renderTasks()};d.lastChild.onclick=()=>{tasks.splice(i,1);SV('maya_tasks',tasks);renderTasks()};l.appendChild(d)});
 const w=$('#week');w.innerHTML='';for(let i=0;i<7;i++){const d=new Date(Date.now()+i*864e5),e=document.createElement('div');e.className='day'+(i?'':' now');e.innerHTML=`<small>${d.toLocaleDateString('en',{weekday:'short'})}</small><b>${d.getDate()}</b>`;w.appendChild(e)}}
$('#tadd').onclick=()=>{const v=$('#tin').value.trim();if(v){tasks.push({t:v,d:0});SV('maya_tasks',tasks);$('#tin').value='';renderTasks()}};

/* ---- profile ---- */
$('#psave').onclick=()=>{S={name:$('#pn').value.trim()||'Simanto',key:$('#pk').value.trim(),voice:$('#pv').value,live:$('#pl').value.trim(),chat:$('#pc').value.trim()};SV('maya_s',S);hello();toast('Saved')};
$('#pmic').onclick=()=>navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(t=>t.stop());toast('Microphone: allowed')}).catch(()=>toast('Microphone: denied. Turn it on in phone Settings > Apps > Maya > Permissions'));
$('#pmem').onclick=()=>{mem=[];SV('maya_mem',mem);toast('Memory cleared')};

/* ---- live call ---- */
const WORKLET=`class P extends AudioWorkletProcessor{constructor(){super();this.b=[];this.r=sampleRate/16000;this.p=0;this.a=0;this.c=0}process(i){const x=i[0][0];if(!x)return true;for(let k=0;k<x.length;k++){this.a+=x[k];this.c++;this.p++;if(this.p>=this.r){this.b.push(Math.max(-1,Math.min(1,this.a/this.c)));this.a=0;this.c=0;this.p-=this.r}}if(this.b.length>=1600){const o=new Int16Array(this.b.map(v=>v*32767));this.port.postMessage(o.buffer,[o.buffer]);this.b=[]}return true}}registerProcessor('pcm',P)`;
let ws,ready=false,live=false,retry=0,stream,micCtx,node,playCtx,nextT=0,srcs=[],wake;
const setOrb=c=>$('#orb').className='orb '+c,setStatus=t=>$('#status').textContent=t;
const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
async function startCall(){
 if(live)return;if(!S.key){tab('profile');toast('Paste your Gemini key first');return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}})}catch{toast('Allow the microphone to start a call');return}
 live=true;retry=0;$('#home').classList.add('live');$('#cap').innerHTML='';setStatus('Connecting…');setOrb('listen');$('#end').hidden=false;
 micCtx=new AudioContext();playCtx=new AudioContext({sampleRate:24000});micCtx.resume();playCtx.resume();
 await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET],{type:'text/javascript'})));
 node=new AudioWorkletNode(micCtx,'pcm');
 node.port.onmessage=e=>{if(ws?.readyState===1&&ready)ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(e.data),mimeType:'audio/pcm;rate=16000'}}}))};
 micCtx.createMediaStreamSource(stream).connect(node);
 try{wake=await navigator.wakeLock?.request('screen')}catch{}
 callChat=newChat('Call');last=null;openWS()}
function openWS(){ready=false;
 ws=new WebSocket('wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key='+encodeURIComponent(S.key));
 ws.onopen=()=>ws.send(JSON.stringify({setup:{model:'models/'+S.live,generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:S.voice}}}},systemInstruction:{parts:[{text:sys()}]},tools:TOOLS,inputAudioTranscription:{},outputAudioTranscription:{},realtimeInputConfig:{automaticActivityDetection:{startOfSpeechSensitivity:'START_SENSITIVITY_LOW',endOfSpeechSensitivity:'END_SENSITIVITY_HIGH',silenceDurationMs:450}}}}));
 ws.onmessage=async ev=>{let d=ev.data;if(d instanceof Blob)d=await d.text();onMsg(JSON.parse(d))};
 ws.onclose=e=>{ready=false;if(!live)return;retry++;if(retry>5){toast('Call failed: '+(e.reason||'code '+e.code));endCall();return}setStatus('Reconnecting…');setTimeout(()=>live&&openWS(),Math.min(800*retry,4000))}}
function onMsg(m){
 if(m.setupComplete){ready=true;retry=0;setStatus('Listening… speak');setOrb('listen');return}
 const c=m.serverContent;
 if(c){if(c.interrupted){stopPlay();last=null}
  c.modelTurn?.parts?.forEach(p=>p.inlineData&&play(p.inlineData.data));
  if(c.inputTranscription?.text)addT('u',c.inputTranscription.text);
  if(c.outputTranscription?.text)addT('m',c.outputTranscription.text);
  if(c.turnComplete){last=null;setOrb('listen');setStatus('Listening… speak')}}
 if(m.toolCall)runTools(m.toolCall.functionCalls||[])}
async function runTools(fc){const out=[];for(const f of fc)out.push({id:f.id,name:f.name,response:{result:await doTool(f.name,f.args||{})}});ws?.readyState===1&&ws.send(JSON.stringify({toolResponse:{functionResponses:out}}))}
function capRender(){const b=$('#cap');b.innerHTML='';(callChat?.m||[]).slice(-8).forEach(([r,t])=>{const d=document.createElement('div');d.className='m '+r;d.textContent=t;b.appendChild(d)});b.scrollTop=b.scrollHeight}
function addT(r,t){if(!callChat)return;t=t.replace(/<\/?noise>/gi,'');if(!t.trim()&&last!==r)return;const m=callChat.m;if(last===r&&m.length)m[m.length-1][1]+=t;else m.push([r,t.trimStart()]);last=r;persist();capRender();if(cur===callChat&&$('#chat').classList.contains('on'))renderMsgs()}
function play(b){const bin=atob(b),n=bin.length>>1,buf=playCtx.createBuffer(1,n,24000),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=((bin.charCodeAt(2*i)|bin.charCodeAt(2*i+1)<<8)<<16>>16)/32768;
 const s=playCtx.createBufferSource();s.buffer=buf;s.connect(playCtx.destination);nextT=Math.max(nextT,playCtx.currentTime+.05);s.start(nextT);nextT+=buf.duration;srcs.push(s);s.onended=()=>{srcs=srcs.filter(x=>x!==s)};setOrb('speak');setStatus('Maya is speaking…')}
const stopPlay=()=>{srcs.forEach(s=>{try{s.stop()}catch{}});srcs=[];nextT=0};
function endCall(){live=false;try{ws?.close()}catch{}node?.disconnect();stream?.getTracks().forEach(t=>t.stop());micCtx?.close();playCtx?.close();wake?.release?.();stopPlay();callChat=null;last=null;ready=false;setOrb('');$('#end').hidden=true;$('#home').classList.remove('live');setStatus('Tap the orb to start a call')}
$('#orb').onclick=()=>live?endCall():startCall();$('#end').onclick=endCall;
</script></body></html>
